name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          BACKEND_URL: ""
          LUMINA_CONTROL_URL: http://127.0.0.1:9
          DATA_HUB_URL: http://127.0.0.1:9
          OPENROUTER_BASE_URL: http://127.0.0.1:9
      - run: pnpm exec tsc --noEmit
      - name: Install pinned browser for public-route smoke tests
        run: |
          mkdir -p .cache/playwright
          TMPDIR="$PWD/.cache/playwright" pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
